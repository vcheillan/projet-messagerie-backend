<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="conteneur-application">

    <aside class="barre-laterale">
        <div class="en-tete-lateral">
            <h1 class="logo-titre"><i class="fas fa-comments"></i> Messagerie</h1>
        </div>

        <div class="contenu-lateral">
            <div class="groupe-saisie">
                <label>Mon Profil</label>
                <select id="me" onchange="connect()" class="menu-deroulant"></select>
            </div>

            <div class="groupe-saisie">
                <label>Discuter avec</label>
                <select id="to" onchange="load()" class="menu-deroulant"></select>
            </div>
        </div>

        <div class="zone-utilisateurs-actifs">
            <span class="titre-section">Membres actifs</span>
            <ul id="list" class="liste-utilisateurs"></ul>
        </div>

        <div class="pied-lateral">
            <input id="n" placeholder="Nom" class="champ-saisie">
            <input id="e" placeholder="Email" class="champ-saisie">
            <button onclick="addUser()" class="bouton-principal">Créer un compte</button>
        </div>
    </aside>

    <main class="fenetre-discussion">
        <header class="en-tete-discussion">
            <div class="info-utilisateur">
                <div class="avatar-utilisateur"><i class="fas fa-user"></i></div>
                <div>
                    <h2 id="chat-title" class="nom-utilisateur">Sélectionnez un contact</h2>
                    <p id="chat-email" class="statut-utilisateur"></p>
                </div>
            </div>
        </header>

        <div id="msgs" class="liste-messages barre-defilement-perso">
            <div class="etat-vide">
                <i class="fas fa-paper-plane"></i>
                <p>Commencez une conversation...</p>
            </div>
        </div>

        <footer class="zone-saisie-message">
            <div class="conteneur-saisie">
                <input id="in" onkeypress="if(event.key === 'Enter') send()" placeholder="Écrivez votre message..." class="champ-message">
                <button onclick="send()" class="bouton-envoyer">
                    <span>Envoyer</span> <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
